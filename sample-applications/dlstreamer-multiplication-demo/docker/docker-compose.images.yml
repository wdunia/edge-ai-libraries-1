services:
  broker:
    image: eclipse-mosquitto:2
    container_name: dlm-mqtt-broker
    hostname: mqtt-broker
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"
    networks:
      - app_network

  dlstreamer-pipeline-server:
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
    container_name: dlm-dlstreamer-pipeline-server
    hostname: dlstreamer-pipeline-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    tty: true
    ports:
      - "8080:8080"
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - ENABLE_RTSP=true
      - RTSP_PORT=8554
      - ENABLE_WEBRTC=true
      - WEBRTC_SIGNALING_SERVER=http://mediamtx:${WHIP_SERVER_PORT}
      - LOG_LEVEL=${LOG_LEVEL}
      - HTTPS=false
      - MTLS_VERIFICATION=false
      - MR_URL=${MR_URL}
      - MR_SAVED_MODELS_DIR=${MR_SAVED_MODELS_DIR}
      - MR_REQUEST_TIMEOUT=${MR_REQUEST_TIMEOUT}
      - MR_VERIFY_CERT=${MR_VERIFY_CERT}
      - REST_SERVER_PORT=8080
      - SERVICE_NAME=dlstreamer-pipeline-server
      - ENABLE_OPEN_TELEMETRY=${ENABLE_OPEN_TELEMETRY}
      - OTEL_COLLECTOR_HOST=${OTEL_COLLECTOR_HOST}
      - OTEL_COLLECTOR_PORT=${OTEL_COLLECTOR_PORT}
      - OTEL_EXPORT_INTERVAL_MILLIS=${OTEL_EXPORT_INTERVAL_MILLIS}
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
    volumes:
      # Shared sample assets live under microservices/dlstreamer-pipeline-server/resources.
      - ../../../microservices/dlstreamer-pipeline-server/resources:/home/pipeline-server/resources:rw
      - ./config.json:/home/pipeline-server/config.json:ro
      - vol_pipeline_root:/var/cache/pipeline_root:rw
      - /run/udev:/run/udev:ro
      - /dev:/dev
      - /tmp:/tmp
      - ./mr_models:/home/pipeline-server/mr_models:rw
    group_add:
      - "${RENDER_GID}"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    networks:
      - app_network

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: dlm-mediamtx-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MTX_LOGLEVEL=info
      - MTX_RTSP=yes
      - MTX_RTMP=no
      - MTX_SRT=no
      - MTX_HLS=no
      - MTX_WEBRTCTRACKGATHERTIMEOUT=${WHIP_SERVER_TIMEOUT}
      - MTX_WEBRTCADDRESS=:${WHIP_SERVER_PORT}
      - MTX_WEBRTCICESERVERS2_0_URL=turn:${WHIP_SERVER_IP}:3478
      - MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME}
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD}
    ports:
      - "${WHIP_SERVER_PORT}:8889"
      - "8554:8554"
      - "8189:8189"
      - "9997:9997"
    networks:
      - app_network

  coturn:
    image: coturn/coturn:latest
    container_name: dlm-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    command:
      - -v
      - -n
      - --lt-cred-mech
      - --user=${MTX_WEBRTCICESERVERS2_0_USERNAME}:${MTX_WEBRTCICESERVERS2_0_PASSWORD}
      - --realm=webrtc
      - --fingerprint
      - --external-ip=${WHIP_SERVER_IP}
    networks:
      - app_network

  metrics-manager:
    image: intel/metrics-manager:2026.1.0
    container_name: dlm-metrics-manager
    privileged: true
    pid: host
    security_opt:
      - apparmor:unconfined
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /sys:/sys:ro
      - /run:/run:ro
    ports:
      - "9090:9090"
      - "9273:9273"
    environment:
      - METRICS_PORT=9090
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    networks:
      - app_network

  dlstreamer-pipeline-server-be:
    image: ${DLSTREAMER_DEMO_BE_IMAGE}
    container_name: dlm-dlstreamer-pipeline-server-be
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ip=${ip}
      - HOST_IP=${ip}
      - METRICS_ENDPOINT=http://metrics-manager:9273/metrics
      - PIPELINE_SERVER_TIMEOUT=${PIPELINE_SERVER_TIMEOUT:-30}
      - PIPELINE_DELETE_TIMEOUT=${PIPELINE_DELETE_TIMEOUT:-8}
      - PIPELINE_STOP_WAIT_TIMEOUT=${PIPELINE_STOP_WAIT_TIMEOUT:-8}
      - PIPELINE_STOP_POLL_INTERVAL=${PIPELINE_STOP_POLL_INTERVAL:-0.5}
      - PIPELINE_ADD_MAX_WORKERS=${PIPELINE_ADD_MAX_WORKERS:-3}
      - DLSPS_SHARE_MODEL_INSTANCE=${DLSPS_SHARE_MODEL_INSTANCE:-false}
      - DLSPS_CPU_INFERENCE_INTERVAL=${DLSPS_CPU_INFERENCE_INTERVAL:-1}
      - DLSPS_GPU_PRE_PROCESS_BACKEND=${DLSPS_GPU_PRE_PROCESS_BACKEND:-va-surface-sharing}
      - DLSPS_GPU_INFERENCE_REGION=${DLSPS_GPU_INFERENCE_REGION:-full-frame}
      - DLSPS_GPU_INFERENCE_INTERVAL=${DLSPS_GPU_INFERENCE_INTERVAL:-1}
      - DLSPS_GPU_BATCH_SIZE=${DLSPS_GPU_BATCH_SIZE:-1}
      - DLSPS_GPU_NIREQ=${DLSPS_GPU_NIREQ:-1}
      - DLSPS_GPU_IE_CONFIG=${DLSPS_GPU_IE_CONFIG:-GPU_THROUGHPUT_STREAMS=1}
      - DLSPS_GPU_THRESHOLD=${DLSPS_GPU_THRESHOLD:-0.7}
      - DLSPS_GPU_SHARE_MODEL_INSTANCE=${DLSPS_GPU_SHARE_MODEL_INSTANCE:-true}
      - DLSPS_NPU_PRE_PROCESS_BACKEND=${DLSPS_NPU_PRE_PROCESS_BACKEND:-va}
      - DLSPS_NPU_INFERENCE_INTERVAL=${DLSPS_NPU_INFERENCE_INTERVAL:-1}
      - DLSPS_NPU_BATCH_SIZE=${DLSPS_NPU_BATCH_SIZE:-1}
      - DLSPS_NPU_NIREQ=${DLSPS_NPU_NIREQ:-1}
      - DLSPS_NPU_SHARE_MODEL_INSTANCE=${DLSPS_NPU_SHARE_MODEL_INSTANCE:-true}
    ports:
      - "8888:8888"
    networks:
      - app_network

  dlstreamer-pipeline-server-ui:
    image: ${DLSTREAMER_DEMO_UI_IMAGE}
    container_name: dlm-dlstreamer-pipeline-server-fe
    environment:
      - VITE_PIPELINE_SERVER_URL=${VITE_PIPELINE_SERVER_URL}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WEBRTC_URL=${VITE_WEBRTC_URL}
      - VITE_SYSTEM_INFO=${VITE_SYSTEM_INFO}
      - VITE_MODEL_PATH=${VITE_MODEL_PATH}
      - VITE_DEFAULT_STREAM_URL=${VITE_DEFAULT_STREAM_URL}
      - VITE_DEFAULT_STREAM_NAME=${VITE_DEFAULT_STREAM_NAME}
      - VITE_DEFAULT_SOURCE_MODE=${VITE_DEFAULT_SOURCE_MODE}
      - VITE_DEFAULT_STREAM_URL_FILE=${VITE_DEFAULT_STREAM_URL_FILE}
      - VITE_DEFAULT_STREAM_URL_RTSP=${VITE_DEFAULT_STREAM_URL_RTSP}
      - VITE_DEFAULT_INSTANCE_COUNT=${VITE_DEFAULT_INSTANCE_COUNT}
      - VITE_DEFAULT_INFERENCE_INTERVAL=${VITE_DEFAULT_INFERENCE_INTERVAL}
      - VITE_DEFAULT_INFERENCE_RESOLUTION=${VITE_DEFAULT_INFERENCE_RESOLUTION}
      - VITE_DEFAULT_MODEL_SHARING=${VITE_DEFAULT_MODEL_SHARING}
    ports:
      - "8101:8101"
    networks:
      - app_network

  dlstreamer-pipeline-server-nginx:
    image: nginx:latest
    container_name: dlm-dlstreamer-pipeline-server-nginx
    ports:
      - "8102:8102"
    volumes:
      - ../nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      - dlstreamer-pipeline-server

networks:
  app_network:
    driver: bridge

volumes:
  vol_pipeline_root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
