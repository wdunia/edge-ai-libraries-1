services:
  verify:
    image: python:3.12-slim
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - "${BONSAI_MODEL_DIR:?Set BONSAI_MODEL_DIR to the downloaded model}:/model:ro"
      - "./verify_bonsai.py:/opt/verify_bonsai.py:ro"
    command: ["python", "/opt/verify_bonsai.py", "/model", "${BONSAI_VARIANT:?Set BONSAI_VARIANT}"]
